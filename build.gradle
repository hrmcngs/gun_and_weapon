plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// =====================================================================
// バージョン決定 (Backpack-Arsenal と同じ仕組みの簡易版):
//   ./gradlew build (bash build.sh) 実行時に対話プロンプトが出る:
//     1) version を聞く (空 Enter で gradle.properties の mod_version)
//     2) release type を聞く (b/a/r/rc/t)
//   最終的に "<version><suffix>" が jar 名と mods.toml の version になる。
//   CI (GITHUB_ACTIONS) と -Prelease_type / -Pmod_version_override 指定時、
//   build 以外のタスク (runClient 等) ではプロンプトを skip。
//   stdin が無い場合 (スクリプト実行) は既定値で進む。
// =====================================================================
ext.stripReleaseSuffix = { String v -> v?.replaceFirst(/-(alpha|beta|rc|test)(\.\d+)?$/, '') }
ext.suffixForReleaseType = { String type ->
    if (!type) return ''
    def t = type.toLowerCase().trim()
    if (t.startsWith('rc')) return '-rc'
    if (t.startsWith('r')) return ''
    if (t.startsWith('b')) return '-beta'
    if (t.startsWith('a')) return '-alpha'
    if (t.startsWith('t')) return '-test'
    return ''
}
ext.cachedStdinReader = null
ext.readLineFlexible = { ->
    def console = System.console()
    if (console != null) {
        try { return console.readLine() } catch (Throwable ignored) {}
    }
    if (project.ext.cachedStdinReader == null) {
        try {
            project.ext.cachedStdinReader = new BufferedReader(new InputStreamReader(System.in))
        } catch (Throwable ignored) {
            return null
        }
    }
    try { return project.ext.cachedStdinReader.readLine() } catch (Throwable ignored) { return null }
}

def baseModVersion = (project.findProperty('mod_version') ?: '1.0.0').toString()
def overrideReleaseType = project.findProperty('release_type')
def overrideModVersion  = project.findProperty('mod_version_override')
def isCi = System.getenv('CI') == 'true' || System.getenv('GITHUB_ACTIONS') == 'true'
def shouldPrompt = !overrideReleaseType && !overrideModVersion && !isCi &&
        gradle.startParameter.taskNames.any { it == 'build' || it.endsWith(':build') }

def chosenBaseVersion = null
def chosenReleaseType = overrideReleaseType
if (shouldPrompt) {
    def fallbackBase = stripReleaseSuffix(baseModVersion)
    print "\n[gun_and_weapon] Enter mod version (press Enter for ${fallbackBase}):\n  > "
    System.out.flush()
    def input = readLineFlexible()?.trim()
    chosenBaseVersion = input ? stripReleaseSuffix(input) : fallbackBase

    print "\n[gun_and_weapon] Select release type for version ${chosenBaseVersion}:\n" +
          "  [b]eta     (-beta)\n" +
          "  [a]lpha    (-alpha)\n" +
          "  [r]elease  (suffix 無し, default)\n" +
          "  [rc]       (-rc)\n" +
          "  [t]est     (-test, ローカル確認用)\n" +
          "  > "
    System.out.flush()
    def typeInput = readLineFlexible()
    chosenReleaseType = typeInput?.trim() ? typeInput.trim() : 'r'
}

if (overrideModVersion) {
    version = overrideModVersion.toString()
} else if (chosenBaseVersion != null) {
    version = chosenBaseVersion + suffixForReleaseType(chosenReleaseType?.toString())
} else if (overrideReleaseType) {
    version = stripReleaseSuffix(baseModVersion) + suffixForReleaseType(overrideReleaseType.toString())
} else {
    version = baseModVersion
}
logger.lifecycle("[gun_and_weapon] version = ${version}")

// 対話で選んだ version を gradle.properties に書き戻す (次回の既定値になる)
if (shouldPrompt) {
    def gradleProps = file('gradle.properties')
    if (gradleProps.exists()) {
        def lines = gradleProps.readLines()
        def newLines = lines.collect { line ->
            (line ==~ /^\s*mod_version\s*=.*$/) ? "mod_version=${version}".toString() : line
        }
        if (lines != newLines) {
            gradleProps.text = newLines.join('\n') + '\n'
            logger.lifecycle("[gun_and_weapon] persisted mod_version=${version} -> gradle.properties")
        }
    }
}

group = 'com.yourname.modid'
archivesBaseName = 'gun_and_weapon'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// =====================================================================
// 本体MOD「The four primitives and Weapons」jar の自動取り込み
//   ~/The-four-primitives-and-Weapons/build/libs から最新jarを
//   libs/local/ にコピーする (addons-Sample と同じ方式)。
//   他環境では gradle.properties の mawSourceProject で上書き可能。
// =====================================================================
def maw_artifact = 'the_four_primitives_and_weapons'
def maw_version  = '1.20.1-local'
def mawSourceProject = project.findProperty('mawSourceProject')
        ?: "${System.getProperty('user.home')}/The-four-primitives-and-Weapons"
def mawDestDir  = file("libs/local/${maw_artifact}/${maw_version}")
def mawDestFile = new File(mawDestDir, "${maw_artifact}-${maw_version}.jar")
def mawSourceJarDir = file("${mawSourceProject}/build/libs")
if (mawSourceJarDir.exists()) {
    def latestJar = mawSourceJarDir.listFiles()
            .findAll { it.name.endsWith('.jar') &&
                       !it.name.contains('-sources') &&
                       !it.name.contains('-dev') &&
                       !it.name.contains('-javadoc') }
            .max { it.lastModified() }
    if (latestJar != null && (!mawDestFile.exists() || latestJar.lastModified() > mawDestFile.lastModified())) {
        mawDestDir.mkdirs()
        mawDestFile.bytes = latestJar.bytes
        println "[addon] 本体MOD jar を取り込みました: ${latestJar.name} → ${mawDestFile.name}"
    }
} else if (!mawDestFile.exists()) {
    logger.warn("[addon] 本体MOD ソース ${mawSourceProject} が見つからず、libs/local にもjarが無い。")
    logger.warn("[addon] libs/local/${maw_artifact}/${maw_version}/ に手動でjarを置いてください。")
}

// =====================================================================
// TaCZ jar のベンダリング (--offline ビルド対応)
//   curse.maven からの解決はネットワークが要るため、一度取得できた jar を
//   libs/local/tacz/ にコピーしておき、以後はそちらを参照する。
//   これで CurseMaven に一切アクセスせずに --offline ビルドできる。
//
//   手動で置くこともできる (CurseForge から落とした jar をリネーム):
//     libs/local/tacz/1.20.1-1.1.7/tacz-1.20.1-1.1.7.jar
// =====================================================================
def tacz_version   = '1.20.1-1.1.7'
def tacz_curse_id  = 'timeless-and-classics-zero-1028108'
def tacz_curse_file = '7401617'
def taczDestDir  = file("libs/local/tacz/${tacz_version}")
def taczDestFile = new File(taczDestDir, "tacz-${tacz_version}.jar")

if (!taczDestFile.exists()) {
    // Gradle のモジュールキャッシュに既に落ちていればそこからコピーする。
    def taczCacheRoot = file("${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/curse.maven/${tacz_curse_id}/${tacz_curse_file}")
    if (taczCacheRoot.exists()) {
        def cachedJar = fileTree(taczCacheRoot) { include '**/*.jar' }.files
                .find { !it.name.contains('-sources') && !it.name.contains('-javadoc') }
        if (cachedJar != null) {
            taczDestDir.mkdirs()
            taczDestFile.bytes = cachedJar.bytes
            println "[addon] TaCZ jar をベンダリングしました: ${cachedJar.name} → ${taczDestFile.name}"
        }
    }
}
def taczVendored = taczDestFile.exists()
if (taczVendored) {
    println "[addon] TaCZ: libs/local から使用 (--offline 可)"
} else {
    logger.lifecycle("[addon] TaCZ: CurseMaven から取得します (初回はネットワークが必要)")
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                jvmArgs += mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.toList()
            }
            // QUICKPLAY_WORLD=<world名> で起動時にそのワールドへ自動参加 (デバッグ用)
            def quickPlayWorld = System.getenv('QUICKPLAY_WORLD')
            if (quickPlayWorld) {
                args '--quickPlaySingleplayer', quickPlayWorld
            }
        }

        server {
        }

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // ----- dev実行時の mixin refmap remap 設定 -----
            // 前提MOD (The four primitives and Weapons など) の jar 内 mixin の refmap は
            // SRG 名で書かれているため、official mapping の dev 環境では
            // そのままだと mixin がターゲットを見つけられず適用されない。
            // (例: MAW の WeaponStatsMixin が効かず weapon_stats が反映されない)
            // mixin.env.remapRefMap=true で runtime に SRG→official 変換を行わせる。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg".toString()

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // libs/ をローカルMavenリポジトリとして扱う（本体MOD jar 用）
    //   配置: libs/local/<name>/<version>/<name>-<version>.jar
    maven {
        url = file('libs').toURI()
        metadataSources { artifact() }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Curios — TheIllusiveC4 公式 Maven (本体MOD準拠)
    maven { url 'https://maven.theillusivec4.top/' }
    // GeckoLib — Cloudsmith Maven (本体MOD準拠)
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // TaCZ 1.20.1-1.1.7-hotfix
    //   libs/local にベンダリング済みならそちらを使う (--offline 可)。
    //   無ければ CurseMaven から取得し、次回ビルド時にベンダリングされる。
    if (taczVendored) {
        implementation fg.deobf("local:tacz:${tacz_version}")
    } else {
        implementation fg.deobf("curse.maven:${tacz_curse_id}:${tacz_curse_file}")
    }

    // 本体MOD「The four primitives and Weapons」(libs/local から取り込み)
    // SkillRegistry / ISkillAction を使って特殊技を登録するため implementation。
    implementation fg.deobf("local:${maw_artifact}:${maw_version}")

    // 本体MODの前提 — dev実行時のランタイム用 (本体MODの任意依存)
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.10.0+1.20.1")
    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7.3")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


// mods.toml の version を build 時に展開
processResources {
    inputs.property 'mod_version', version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': version
    }
}

apply from: 'mcreator.gradle'

